[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "diffargo"
version = "0.1.0"
description = "Conditional diffusion forecast for GLORYS temperature and salinity"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "numpy>=1.26",
  "netCDF4>=1.7",
  "PyYAML>=6.0",
  "torch>=2.2",
  "tqdm>=4.66",
]

[tool.setuptools]
packages = ["diffargo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
