seed: 20260910

data:
  root: "data/reanalysis_31year"
  temperature_subdir: "thetao_glor_1.5deg"
  salinity_subdir: "so_glor_1.5deg"
  temperature_pattern: "thetao_glor_{year}_0_1.5deg.nc"
  salinity_pattern: "so_glor_{year}_0_1.5deg.nc"
  temperature_variable: "thetao_glor"
  salinity_variable: "so_glor"
  depth_name: "elevation"
  latitude_name: "lat"
  longitude_name: "lon"
  time_name: "time"
  train_years: [1993, 2016]
  val_years: [2017, 2019]
  test_years: [2020, 2023]
  context_days: 3
  lead_days: 1
  stats_path: "artifacts/stats_train_1993_2016.npz"
  stats_chunk_days: 10
  file_cache_size: 12

model:
  base_channels: 64
  channel_multipliers: [1, 2, 4, 6]
  time_embedding_dim: 256
  dropout: 0.05
  attention_at_bottleneck: true

diffusion:
  timesteps: 1000
  beta_schedule: "cosine"
  sampling_steps: 50
  ddim_eta: 0.0

train:
  objective: "rollout_finetune"
  init_checkpoint: "runs/hpc_direct/checkpoint_best.pt"
  resume: null
  output_dir: "runs/hpc_rollout_h7"
  rollout_days: 7
  trajectory_stride_days: 3
  validation_horizon_days: 30
  validation_stride_days: 90
  validation_leads: [1, 3, 7, 15, 30]
  epochs: 8
  batch_size: 1
  num_workers: 8
  learning_rate: 0.00002
  weight_decay: 0.0001
  gradient_accumulation: 2
  gradient_clip_norm: 0.5
  warmup_updates: 200
  amp: true
  amp_dtype: "bfloat16"
  ema_decay: 0.999
  log_every_steps: 20
  early_stop_patience: 3

  # Curriculum: mostly free running from the start, fully free after 3 epochs.
  teacher_forcing_start: 0.25
  teacher_forcing_end: 0.0
  teacher_forcing_decay_fraction: 0.375
  lead_weight_end: 2.0

  # Emphasize the components that degraded first in the 30-day experiment.
  salinity_loss_weight: 1.5
  deep_threshold_m: 200.0
  deep_loss_weight: 2.0

  # Soft penalties only; inference is never clipped.
  temperature_soft_range: [-3.0, 40.0]
  salinity_soft_range: [0.0, 42.0]
  temperature_penalty_scale: 2.0
  salinity_penalty_scale: 0.5
  physical_penalty_weight: 0.01
